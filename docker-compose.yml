version: '3.8'

services:
  repouplink:
    build: .
    container_name: repouplink
    ports:
      - "5000:5000"  # Access the web GUI at http://localhost:5000
    volumes:
      # Persist settings (GitHub token, preferences) between container restarts
      - ./data:/app/data

      # IMPORTANT: Mount your project folders to access them in the container
      # Uncomment and customize the line below based on your OS:

      # Windows example (adjust the path to your projects folder):
      # - C:/Users/YourName/Projects:/projects

      # Linux example:
      # - /home/username/projects:/projects

      # macOS example:
      # - /Users/username/projects:/projects

      # You can mount multiple folders:
      # - C:/Work:/work
      # - C:/Personal:/personal

      # Then in the web interface, use the container path:
      # Instead of C:/Users/YourName/Projects/MyApp
      # Use: /projects/MyApp
    environment:
      - FLASK_ENV=production
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - SETTINGS_FILE=/app/data/settings.json
      # Uncomment to set a custom secret key:
      # - SECRET_KEY=${SECRET_KEY}
    restart: unless-stopped
    networks:
      - repouplink-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  repouplink-network:
    driver: bridge
